<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find Your Exhibit</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <!-- Navigation -->
    <header>
        <nav>

            <h2>The Wolfsonian-FIU</h2>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li>
                    <a href="questionnaire.html">
                        Find an Exhibit
                    </a>
                </li>
                <li><a href="checkout.html">Tickets</a></li>
            </ul>

        </nav>
    </header>


    <!-- Page Header -->
    <section class="page-header">

        <p class="small-title">PERSONALIZED EXPERIENCE</p>

        <h1>Find Your Exhibit</h1>

        <p>
            Answer three questions to get a recommendation.
        </p>

    </section>


    <!-- Questionnaire -->
    <main class="questionnaire">

        <form id="questionnaireForm">


            <!-- Question 1 -->
            <div class="question">

                <h2>1. What type of design interests you?</h2>

                <label>
                    <input
                        type="radio"
                        name="question1"
                        value="modern"
                        required
                    >
                    Modern and geometric
                </label>

                <label>
                    <input
                        type="radio"
                        name="question1"
                        value="art"
                    >
                    Artistic and decorative
                </label>

                <label>
                    <input
                        type="radio"
                        name="question1"
                        value="graphic"
                    >
                    Posters and graphics
                </label>

                <label>
                    <input
                        type="radio"
                        name="question1"
                        value="objects"
                    >
                    Objects and inventions
                </label>

            </div>


            <!-- Question 2 -->
            <div class="question">

                <h2>2. What would you like to explore?</h2>

                <label>
                    <input
                        type="radio"
                        name="question2"
                        value="modern"
                        required
                    >
                    Architecture and design
                </label>

                <label>
                    <input
                        type="radio"
                        name="question2"
                        value="art"
                    >
                    Art and decoration
                </label>

                <label>
                    <input
                        type="radio"
                        name="question2"
                        value="graphic"
                    >
                    Visual stories
                </label>

                <label>
                    <input
                        type="radio"
                        name="question2"
                        value="objects"
                    >
                    Everyday objects
                </label>

            </div>


            <!-- Question 3 -->
            <div class="question">

                <h2>3. What type of experience do you prefer?</h2>

                <label>
                    <input
                        type="radio"
                        name="question3"
                        value="modern"
                        required
                    >
                    Clean and elegant
                </label>

                <label>
                    <input
                        type="radio"
                        name="question3"
                        value="art"
                    >
                    Creative and colorful
                </label>

                <label>
                    <input
                        type="radio"
                        name="question3"
                        value="graphic"
                    >
                    Interesting stories
                </label>

                <label>
                    <input
                        type="radio"
                        name="question3"
                        value="objects"
                    >
                    Curious and interactive
                </label>

            </div>


            <button type="submit" class="button">
                Get My Recommendation
            </button>

        </form>

    </main>


    <footer>

        <p>The Wolfsonian-FIU</p>

    </footer>


    <script src="main.js"></script>

</body>
</html>
